# Pre-registered single-GPU Qwen3.8-27B CARA trajectory-v2 experiment.
# 历史配置：固定 harmful revision 的 train 只有 416 行。
# train[400:500] 不满足 100 条验证契约，预检必须明确拒绝。
# 新研究使用独立 v3-96 配置；禁止降低 expected_samples 掩盖越界。
model = "/root/autodl-fs/models/Qwen3.8-27B"
model_commit = "1d4bf0f2ff6012fd82039f2fa52739d0dd7c60c0"
abliteration_method = "ara"
ara_objective_version = "trajectory-v2"
dtypes = ["bfloat16"]
quantization = "none"
device_map = "auto"
max_memory = { "0" = "90GiB", cpu = "64GiB" }
offload_outputs_to_cpu = true
batch_size = 1
max_batch_size = 1
max_response_length = 100
chat_template_kwargs = { enable_thinking = false }
generation_kwargs = { do_sample = false }
seed = 42

target_components = ["attn.o_proj", "mlp.down_proj"]
row_normalization = "none"
ara_lora_rank = 128
ara_calibration_size = 96
ara_capture_batch_size = 1
ara_trajectory_tokens = 8
ara_trajectory_decay = 0.85
ara_softmin_temperature = 0.10
ara_lbfgs_max_iter = 20
ara_lbfgs_history_size = 10
ara_max_good_delta_rms = 0.60
ara_max_singular_value = 8.0
recover_orphaned_trials = false

n_trials = 120
n_startup_trials = 24
study_checkpoint_dir = "checkpoints/qwen38-27b-cara-trajectory-v2"
export_strategy = "adapter"
model_action = "save"
save_directory = "adapter"

scorers = [
    { plugin = "heretic.scorers.refusal_log_odds.RefusalLogOdds", optimization = "minimize" },
    { plugin = "heretic.scorers.keyword_rate.KeywordRate", optimization = "none" },
    { plugin = "heretic.scorers.kl_divergence.KLDivergence", optimization = "minimize" },
]

[ara_search_space]
layer_start = [0.15, 0.50]
layer_span = [0.35, 0.75]
attn_strength = [0.05, 4.0]
mlp_strength = [0.0001, 2.0]
push_weight = [0.5, 6.0]
margin = [2.0, 16.0]
attn_deployment_gain = [0.75, 4.0]
mlp_deployment_gain = [0.50, 3.0]

