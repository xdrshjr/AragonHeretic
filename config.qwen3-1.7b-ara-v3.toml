# Qwen/Qwen3-1.7B, single CUDA GPU, BF16, latest ARA engineering mode.
# Architecture source: https://huggingface.co/Qwen/Qwen3-1.7B/raw/main/config.json
model = "/root/autodl-fs/models/Qwen3-1.7B"
abliteration_method = "ara"
ara_objective_version = "sequential-v3"
row_normalization = "none"
dtypes = ["bfloat16"]
quantization = "none"
device_map = "cuda:0"
max_memory = { "0" = "22GiB", cpu = "64GiB" }
batch_size = 1
max_batch_size = 1
max_response_length = 100
offload_outputs_to_cpu = true
chat_template_kwargs = { enable_thinking = false }
generation_kwargs = { do_sample = false, num_beams = 1 }
response_prefix = ""
seed = 42
# Shared v3 schema requires these search limits; engineering CLI sets actual trials.
n_trials = 24
n_startup_trials = 8
ara_lora_rank = 128
# Engineering partitions are selected by --fit-samples, not this schema field.
ara_calibration_size = 96
ara_capture_batch_size = 1
ara_trajectory_tokens = 8
ara_trajectory_decay = 0.85
ara_softmin_temperature = 0.10
ara_lbfgs_max_iter = 20
ara_lbfgs_history_size = 10
ara_max_good_delta_rms = 0.60
ara_max_singular_value = 8.0
target_components = ["attn.o_proj", "mlp.down_proj"]
export_strategy = "adapter"
model_action = "save"

[ara_v3]
artifact_schema = "cara-research-acceptance-v3.1"
proposal_policy = "spectral-backtrack-v1"
backtracking_alphas = [1.0, 0.5, 0.25, 0.125, 0.0625]
spectral_projection_margin = 0.000001
pilot_profile = "full-calibration"
variant = "sequential-refresh"
sweeps = 2
trajectory_policy = "refresh-each-sweep"
keep_reference = "base-anchored"
capture_mode = "sequential"
trial_budget = 24
max_cpu_rss_gib = 64.0

[good_prompts]
dataset = "mlabonne/harmless_alpaca"
commit = "02c6a92cfcf11bb0c387334f8146d149d65b587f"
split = "train[:36]"
column = "text"

[bad_prompts]
dataset = "mlabonne/harmful_behaviors"
commit = "01cead01398926d81f7c52bdb790ee8cf77ebba7"
split = "train[:36]"
column = "text"

[ara_runtime_guard]
expected_target_total = 56
required_target_devices = ["cuda:0"]
min_free_cuda_gib_after_load = 1.5
max_capture_cpu_gib = 64.0
max_cuda_allocated_gib = 22.0

[[ara_runtime_guard.targets]]
name_pattern = "self_attn.o_proj"
count = 28
in_features = 2048
out_features = 2048

[[ara_runtime_guard.targets]]
name_pattern = "mlp.down_proj"
count = 28
in_features = 6144
out_features = 2048
